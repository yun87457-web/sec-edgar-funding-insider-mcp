name: Publish to Official MCP Registry
on:
  workflow_dispatch:
  push:
    paths:
      - server.json
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
      - name: Login via GitHub OIDC & Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
